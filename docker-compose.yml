services:
  # ==================== BACKEND ====================
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: churnxai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql://churnuser:churnpassword@postgres:5432/churnxai
      - MONGODB_URL=mongodb://mongo:27017/churnxai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - churnxai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== FRONTEND ====================
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: churnxai-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - churnxai-network

  # ==================== MLFLOW ====================
  mlflow:
    image: python:3.11-slim
    container_name: churnxai-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    working_dir: /mlruns
    command: >
      bash -c "pip install --no-cache-dir mlflow==2.9.2 && 
      mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns"
    restart: unless-stopped
    networks:
      - churnxai-network

  # ==================== POSTGRESQL ====================
  postgres:
    image: postgres:15-alpine
    container_name: churnxai-postgres
    environment:
      POSTGRES_USER: churnuser
      POSTGRES_PASSWORD: churnpassword
      POSTGRES_DB: churnxai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - churnxai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churnuser -d churnxai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MONGODB ====================
  mongo:
    image: mongo:6
    container_name: churnxai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - churnxai-network

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: churnxai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - churnxai-network
    command: redis-server --appendonly yes

# ==================== VOLUMES ====================
volumes:
  postgres_data:
  mongo_data:
  redis_data:

# ==================== NETWORK ====================
networks:
  churnxai-network:
    driver: bridge
    name: churnxai-network
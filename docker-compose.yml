services:
  # ==================== BACKEND ====================
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: churnxai-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/models:/app/models
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=False
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-churnuser}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your root .env file}@postgres:5432/${POSTGRES_DB:-churnxai}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your root .env file}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - churnxai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== FRONTEND ====================
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: churnxai-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - churnxai-network

  # ==================== MLFLOW ====================
  mlflow:
    image: python:3.11-slim
    container_name: churnxai-mlflow
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./mlruns:/mlruns
    working_dir: /mlruns
    command: >
      bash -c "pip install --no-cache-dir mlflow==2.9.2 && 
      mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns"
    restart: unless-stopped
    networks:
      - churnxai-network

  # ==================== POSTGRESQL ====================
  postgres:
    image: postgres:15-alpine
    container_name: churnxai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-churnuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-churnxai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - churnxai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

# ==================== VOLUMES ====================
volumes:
  postgres_data:

# ==================== NETWORK ====================
networks:
  churnxai-network:
    driver: bridge
    name: churnxai-network